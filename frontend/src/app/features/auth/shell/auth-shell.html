<div class="shell">
  <header class="shell__header">
    <a class="brand" routerLink="/login" aria-label="EnerFacil">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z" /></svg>
      </span>
      <span class="brand__name">EnerFacil</span>
    </a>
    <p class="shell__switch">
      {{ switchText() }}
      <a class="link" [routerLink]="switchLink()">{{ switchLabel() }}</a>
    </p>
  </header>

  <main class="shell__main">
    <section class="shell__form">
      <ng-content />
    </section>

    <aside class="visual" aria-hidden="true">
      <div class="visual__frame">
  <img
      class="visual__image"
      src="images/login.jpg"
      alt="Ilustración relacionada con el consumo energético del hogar"
      />
      <span class="visual__pill">EnerFacil</span>
      </div>

      <div class="notice">
        <span class="notice__icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10.5 9-7.5 9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1v-9.5Z" /></svg>
        </span>
        <div>
          <p class="notice__title">Ahorrar empieza por entender.</p>
          <p class="notice__text">Entiende tu consumo eléctrico y descubre cómo ahorrar en casa.</p>
        </div>
      </div>
    </aside>
  </main>

  <footer class="shell__footer">
    <span>EnerFacil · Tu energía, más clara.</span>
    <span>© {{ year() }} EnerFacil</span>
  </footer>
</div>
